name: Probe Donskoe map sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/map-probe.yml'

permissions:
  contents: write

jobs:
  probe-map:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe NSPD imagery with hard timeouts
        shell: bash
        run: |
          set -u
          rm -rf map-probe-results
          mkdir -p map-probe-results

          probe () {
            NAME="$1"
            URL="$2"
            REF="$3"
            OUT="map-probe-results/${NAME}.img"
            HDR="map-probe-results/${NAME}.headers"
            META="map-probe-results/${NAME}.meta"

            echo "=== $NAME ==="
            START=$(date +%s)
            HTTP=$(curl -L -sS \
              --connect-timeout 3 \
              --max-time 7 \
              --retry 0 \
              -A "Mozilla/5.0 DonskoeMapProbe/2.0" \
              -e "$REF" \
              -D "$HDR" \
              -o "$OUT" \
              -w "%{http_code}" \
              "$URL" 2>"map-probe-results/${NAME}.stderr" || true)
            END=$(date +%s)
            SECS=$((END-START))

            BYTES=0
            [ -f "$OUT" ] && BYTES=$(wc -c < "$OUT" | tr -d ' ')
            TYPE=""
            [ -f "$OUT" ] && TYPE=$(file -b --mime-type "$OUT" || true)

            {
              echo "name=$NAME"
              echo "url=$URL"
              echo "http=$HTTP"
              echo "seconds=$SECS"
              echo "bytes=$BYTES"
              echo "mime=$TYPE"
            } > "$META"

            echo "HTTP=$HTTP time=${SECS}s bytes=$BYTES mime=$TYPE"

            if [ "$HTTP" = "200" ] && [[ "$TYPE" == image/* ]] && [ "$BYTES" -gt 500 ]; then
              EXT="bin"
              case "$TYPE" in
                image/png) EXT="png" ;;
                image/jpeg) EXT="jpg" ;;
                image/webp) EXT="webp" ;;
              esac
              mv "$OUT" "map-probe-results/${NAME}.${EXT}"
              echo "PASS $NAME"
              return 0
            else
              echo "FAIL $NAME"
              return 1
            fi
          }

          PASS=0

          probe "eeko-z16" \
            "https://nspd.gov.ru/cgk/map/39/tms/16/39866/21786.png" \
            "https://nspd.gov.ru/map?baseLayerId=36346" && PASS=$((PASS+1)) || true

          probe "eeko-z17" \
            "https://nspd.gov.ru/cgk/map/39/tms/17/79732/43572.png" \
            "https://nspd.gov.ru/map?baseLayerId=36346" && PASS=$((PASS+1)) || true

          probe "ortho2000-z16" \
            "https://nspd.gov.ru/api/aeggis/v2/36344/wmts/16/39866/21786.png" \
            "https://nspd.gov.ru/map?baseLayerId=36344" && PASS=$((PASS+1)) || true

          probe "ortho2000-z17" \
            "https://nspd.gov.ru/api/aeggis/v2/36344/wmts/17/79732/43572.png" \
            "https://nspd.gov.ru/map?baseLayerId=36344" && PASS=$((PASS+1)) || true

          echo "$PASS" > map-probe-results/pass-count.txt

          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path("map-probe-results")
          results = []
          for p in sorted(root.glob("*.meta")):
              data = {}
              for line in p.read_text(encoding="utf-8").splitlines():
                  if "=" in line:
                      k, v = line.split("=", 1)
                      data[k] = v
              results.append(data)
          out = {
              "probeVersion": 2,
              "results": results,
              "passCount": int((root/"pass-count.txt").read_text().strip() or "0")
          }
          (root/"status.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map-probe-results
          if git diff --cached --quiet; then
            echo "No probe result changes"
            exit 0
          fi
          git commit -m "Probe Donskoe map imagery sources"
          git push
