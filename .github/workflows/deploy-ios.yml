name: Deploy Dryer + Chemical Store

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'donskoe-ios-pwa.zip'
      - 'donskoe-chem-web.zip'
      - '.github/workflows/deploy-ios.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack dryer app
        run: |
          rm -rf site
          mkdir site
          unzip -q donskoe-ios-pwa.zip -d site
          test -f site/index.html

      - name: Unpack chemical store app
        run: |
          if [ -f donskoe-chem-web.zip ]; then
            mkdir -p site/chem
            unzip -q donskoe-chem-web.zip -d site/chem
            test -f site/chem/index.html
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
