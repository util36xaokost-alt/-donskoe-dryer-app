name: Deploy Donskoe production system
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'donskoe-ios-pwa.zip'
      - '.github/workflows/deploy-ios.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and verify one complete release
        run: |
          test -f donskoe-ios-pwa.zip
          mkdir -p site
          unzip -q -o donskoe-ios-pwa.zip -d site
          python3 site/scripts/verify-release.py site
          touch site/.nojekyll
          # All three modules are inside this ZIP. Never overlay an older chem ZIP.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy verified release
        id: deployment
        uses: actions/deploy-pages@v4
